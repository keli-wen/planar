name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: planar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene-ui-hooks:
    name: Hygiene, UI Lint & Hook Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint:ui
      - run: npm run check:hygiene
      - run: npm run test:hooks

  rust-core-cli:
    name: Rust Core & CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p planar-core -p planar-cli --all-targets -- -D warnings
      - run: cargo test -p planar-core -p planar-cli

  rust-workspace-macos:
    name: Full Workspace + Tauri Shell (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
